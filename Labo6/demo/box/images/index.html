<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box</title>
    <style>body{
        background-color: yellow;
        color: green;
        border : 2px solid red;
        font-size: 5em;

    }
    h1 {
        color: red;
        background-color: blue;
        width: 50%;
        font-size: 3em;
        border: 1px solid blue;
        margin: 50px;
        /*T,R,B,L krijgen default 50px*/
        /*padding: 75px;*/
        margin-top: 300px;
        margin-bottom: 100px;
        /*padding: 50px 20px 100px 300px;*/
        /*TOP RIGHT BOTTOM LEFT*/
        padding: 50px 300px;
        /*RIGHT/LEFT  TOP/BOTTOM*/

        /*doet niks, inline-elementen veranderen niet met width*/
        /*Je zou van dat inline element een block-element van maken*/
        /*display: block;  mijn elementen zitten wel niet meer naast elkaar*/
        display: inline-block;
        /*blijft een soort inline maar heeft kenmerken van block en kan dus width bepalen*/
        }
    p {
        width: 49%;
        background-color: gray;
        display: inline-block;
    }
    span {
        width: 400px;
    }
    img {
        display: block;
        margin-left: auto;
        margin-right: auto;
        /*plaatst image in het midden*/
    }
    </style>

</head>
<body>
<h1>VIVES</h1>
<h1>CSS</h1>
<p>Selector</p>
<p>Selector</p>

<span>element 1</span>
<span>element 2</span>
<span>element 3</span>
<span>element 4</span>
<span>element 5</span>

<h2>CSS</h2>
<img src="muziek.jpg" height="200" width="200"/></body>

</html>
